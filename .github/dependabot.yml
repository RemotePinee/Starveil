version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # 依赖只能落进第一个匹配的 group，顺序有意义
      androidx-patch:
        patterns:
          - 'androidx.*'
        update-types:
          - patch
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
      others-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # AGP 大版本会连带要求新的 Gradle 和 JDK，升级前要人看 release notes
      - dependency-name: 'com.android.tools.build:gradle'
        update-types:
          - version-update:semver-major
      # Kotlin 大版本同理：与 compose compiler 版本强绑定
      - dependency-name: 'org.jetbrains.kotlin*'
        update-types:
          - version-update:semver-major
      # androidx 的 minor/major 会连带要求更高的 AGP 与 compileSdk
      # （compose 1.12 要求 AGP 9.1 + compileSdk 37），只自动提补丁
      - dependency-name: 'androidx.*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # compose-bom 用日期版本号，semver 规则不适用，整体交给人工升级
      - dependency-name: 'androidx.compose:compose-bom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
