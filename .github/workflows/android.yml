name: android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # AGENTS.md 第 0 节：./gradlew check 是唯一闸门
      # check 不联网，站点地址用占位符即可；要在这里出正式包时再配 STARVEIL_API_HOST
      - name: check
        run: ./gradlew check --max-workers=1 --no-daemon
        env:
          STARVEIL_API_HOST: ${{ secrets.STARVEIL_API_HOST }}
