[versions]
agp = "8.13.2"
kotlin = "2.1.0"
coreKtx = "1.16.0"
splashscreen = "1.0.1"
lottie = "6.6.6"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
navigationCompose = "2.9.4"
composeBom = "2025.11.01"
media3 = "1.9.1"
datastore = "1.1.7"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.8.1"
coroutines = "1.10.2"
coil = "3.3.0"
# 二维码编码：纯 Java、无 Android 依赖，只用来把分享链接画成二维码。
zxing = "3.5.3"
junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
detekt = "1.23.8"

# 聚合广告 SDK。TopOn 的样式包（rewardedvideo/interstitial/nativead/banner/splash）
# TradPlus 主包版本。adapter 的末段必须与它一致（见下面 tradplus-* 几条），
# 否则 SDK 会报 adapter 不匹配。
tradplus = "16.9.0.1"

[libraries]
# AndroidX 基础
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# 系统启动画面（SplashScreen API）：把冷启动那层"空白窗口"接管掉，
# 能在首页渲染完之前把启动画面停在原地。
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Compose（版本由 BOM 统一约束）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
phosphor-icons = { module = "com.adamglin:phosphor-icon", version = "1.0.0" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# 媒体
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# 播放数据源走 OkHttp：与业务请求共用连接池，切集时 TLS 不用重来
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

# 网络
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# 图片
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }

# 聚合广告（只在 :app 引用）。
#
# adapter 是"聚合壳 → 广告源（ADN）"的桥接包，不是接聚合平台本身：TopOn / TradPlus
# 都不产广告，后台配了哪个网络就必须有对应 adapter，否则填充率恒为 0。
#
# 只选审核对内容类友好的几家，穿山甲（pangle）与优量汇（gdt）不接：
# 这两家对影视/短剧类应用审核最严，过不了就等于白加依赖还多一堆权限。
# 厂商联盟（小米/OPPO/vivo）跟随应用商店上架，是这类应用最实际的量来源。
#
# adapter 版本末段必须与聚合壳一致（16.9.0.1），第一段是 TradPlus 给该网络的编号。
# 主包一升级，这里全部要跟着改，否则 SDK 会报 adapter 不匹配。
# core-taku 6.6.x 是全家桶：banner / interstitial / nativead / rewardedvideo / splash
# 的类已经包含在 core 里，再引 6.5.40 的样式包会撞「Duplicate class」。样式包只给
# 老版本（core 6.5.40 时代）分开引，本工程不需要。
tradplus = { module = "com.tradplusad:tradplus", version.ref = "tradplus" }
tradplus-sigmob = { module = "com.tradplusad:tradplus-sigmob", version = "21.16.9.0.1" }
# 厂商联盟：跟随应用商店上架，过审压力最小
tradplus-mimo = { module = "com.tradplusad:tradplus-mimo", version = "46.16.9.0.1" }
tradplus-oppo = { module = "com.tradplusad:tradplus-oppo", version = "79.16.9.0.1" }
tradplus-vivo = { module = "com.tradplusad:tradplus-vivo", version = "78.16.9.0.1" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
